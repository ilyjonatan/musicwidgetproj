<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MusicWidget</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <div
        id="widget"
        class="idle"
    >

        <div id="album-container">

            <img
                id="album-art"
                alt="Album Art"
            >

        </div>


        <div id="track-info">

            <div id="status">

                <span id="status-dot"></span>

                <span id="status-text">
                    LOADING
                </span>

            </div>


            <span id="song-title">
                Loading...
            </span>


            <span id="artist-name">
                Connecting to Last.fm
            </span>

        </div>


        <div id="watermark">
            by ilyjonatan
        </div>

    </div>


    <script src="musicplayer.js"></script>

</body>

</html>
