<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Last.fm Stream Widget</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 24px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #111118;
            color: white;

            font-family: Arial, Helvetica, sans-serif;
        }

        .setup {
            width: 100%;
            max-width: 720px;

            padding: 28px;

            background: #1c1c26;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 18px;
        }

        h1 {
            margin-top: 0;
            margin-bottom: 8px;
        }

        h2 {
            margin-top: 28px;
            margin-bottom: 16px;

            font-size: 16px;
        }

        p {
            color: rgba(255, 255, 255, 0.65);
            line-height: 1.5;
        }

        label {
            display: block;
            margin-bottom: 8px;

            font-weight: 600;
        }

        input[type="text"] {
            width: 100%;

            padding: 12px 14px;

            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;

            background: #121219;
            color: white;

            font-size: 16px;
        }

        button {
            padding: 12px 16px;

            border: 0;
            border-radius: 10px;

            background: white;
            color: #111118;

            font-weight: 700;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .option-group {
            display: grid;
            gap: 18px;
        }

        .option-row {
            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 18px;

            padding: 14px;

            background: #15151d;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
        }

        .option-row label {
            margin: 0;
        }

        .color-control {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        input[type="color"] {
            width: 46px;
            height: 36px;

            padding: 2px;

            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;

            background: #121219;

            cursor: pointer;
        }

        input[type="range"] {
            width: 220px;
        }

        .range-control {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .range-value {
            min-width: 48px;

            color: rgba(255, 255, 255, 0.7);

            text-align: right;
        }

        .checkbox-control {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        input[type="checkbox"] {
            width: 18px;
            height: 18px;

            cursor: pointer;
        }

        .actions {
            margin-top: 24px;
        }

        .output {
            display: none;

            margin-top: 28px;
        }

        .url-row {
            display: flex;
            gap: 10px;
        }

        .url-row input {
            flex: 1;
            min-width: 0;
        }

        .preview-wrapper {
            margin-top: 24px;

            padding: 18px;

            overflow: auto;

            background:
                linear-gradient(
                    45deg,
                    #222 25%,
                    transparent 25%
                ),
                linear-gradient(
                    -45deg,
                    #222 25%,
                    transparent 25%
                ),
                linear-gradient(
                    45deg,
                    transparent 75%,
                    #222 75%
                ),
                linear-gradient(
                    -45deg,
                    transparent 75%,
                    #222 75%
                );

            background-size: 20px 20px;

            background-position:
                0 0,
                0 10px,
                10px -10px,
                -10px 0px;

            border-radius: 14px;
        }

        iframe {
            width: 440px;
            max-width: 100%;
            height: 140px;

            border: 0;

            background: transparent;
        }

        @media (max-width: 600px) {

            .option-row {
                align-items: flex-start;
                flex-direction: column;
            }

            input[type="range"] {
                width: 100%;
            }

            .range-control {
                width: 100%;
            }

            .range-control input {
                flex: 1;
            }

            .url-row {
                flex-direction: column;
            }
        }
    </style>
</head>


<body>

    <div class="setup">

        <h1>
            Last.fm Stream Widget
        </h1>

        <p>
            Enter the streamer's Last.fm username,
            customize the appearance, preview the widget,
            then copy the generated URL into Pogly
            as a browser/web source.
        </p>


        <label for="username">
            Last.fm Username
        </label>

        <input
            id="username"
            type="text"
            placeholder="ilyjonatan"
            autocomplete="off"
        >


        <h2>
            Appearance
        </h2>


        <div class="option-group">

            <div class="option-row">

                <label for="background-color">
                    Background Color
                </label>

                <div class="color-control">

                    <input
                        id="background-color"
                        type="color"
                        value="#14141c"
                    >

                    <span id="background-color-value">
                        #14141c
                    </span>

                </div>

            </div>


            <div class="option-row">

                <label for="accent-color">
                    Text / Accent Color
                </label>

                <div class="color-control">

                    <input
                        id="accent-color"
                        type="color"
                        value="#ffffff"
                    >

                    <span id="accent-color-value">
                        #ffffff
                    </span>

                </div>

            </div>


            <div class="option-row">

                <label for="opacity">
                    Background Opacity
                </label>

                <div class="range-control">

                    <input
                        id="opacity"
                        type="range"
                        min="0"
                        max="100"
                        value="92"
                    >

                    <span
                        class="range-value"
                        id="opacity-value"
                    >
                        92%
                    </span>

                </div>

            </div>


            <div class="option-row">

                <label for="show-art">
                    Show Album Artwork
                </label>

                <div class="checkbox-control">

                    <input
                        id="show-art"
                        type="checkbox"
                        checked
                    >

                </div>

            </div>


            <div class="option-row">

                <label for="show-status">
                    Show "NOW PLAYING"
                </label>

                <div class="checkbox-control">

                    <input
                        id="show-status"
                        type="checkbox"
                        checked
                    >

                </div>

            </div>

        </div>


        <div class="actions">

            <button id="generate">
                Generate Widget
            </button>

        </div>


        <div
            class="output"
            id="output"
        >

            <label for="widget-url">
                Widget URL
            </label>


            <div class="url-row">

                <input
                    id="widget-url"
                    type="text"
                    readonly
                >

                <button id="copy">
                    Copy
                </button>

            </div>


            <div class="preview-wrapper">

                <iframe
                    id="preview"
                    title="Widget Preview"
                ></iframe>

            </div>

        </div>

    </div>


    <script>

        const usernameInput =
            document.getElementById('username');

        const generateButton =
            document.getElementById('generate');

        const output =
            document.getElementById('output');

        const widgetURLInput =
            document.getElementById('widget-url');

        const preview =
            document.getElementById('preview');

        const copyButton =
            document.getElementById('copy');


        const backgroundColorInput =
            document.getElementById(
                'background-color'
            );

        const backgroundColorValue =
            document.getElementById(
                'background-color-value'
            );

        const accentColorInput =
            document.getElementById(
                'accent-color'
            );

        const accentColorValue =
            document.getElementById(
                'accent-color-value'
            );

        const opacityInput =
            document.getElementById('opacity');

        const opacityValue =
            document.getElementById(
                'opacity-value'
            );

        const showArtInput =
            document.getElementById(
                'show-art'
            );

        const showStatusInput =
            document.getElementById(
                'show-status'
            );


        function cleanHexColor(value) {

            return value
                .replace('#', '')
                .toLowerCase();
        }


        function buildWidgetURL(username) {

            const params =
                new URLSearchParams();

            params.set(
                'user',
                username
            );

            params.set(
                'art',
                showArtInput.checked
                    ? '1'
                    : '0'
            );

            params.set(
                'status',
                showStatusInput.checked
                    ? '1'
                    : '0'
            );

            params.set(
                'opacity',
                opacityInput.value
            );

            params.set(
                'bg',
                cleanHexColor(
                    backgroundColorInput.value
                )
            );

            params.set(
                'accent',
                cleanHexColor(
                    accentColorInput.value
                )
            );


            return (
                `${window.location.origin}` +
                `/widget.html?${params.toString()}`
            );
        }


        async function generateWidget() {

            const username =
                usernameInput.value.trim();


            if (!username) {

                alert(
                    'Enter a Last.fm username.'
                );

                return;
            }


            generateButton.disabled =
                true;

            generateButton.textContent =
                'Checking...';


            try {

                const response =
                    await fetch(
                        `/api/lastfm?username=${encodeURIComponent(username)}`
                    );


                const data =
                    await response.json();


                if (
                    !response.ok ||
                    data.error
                ) {

                    alert(
                        data.message ||
                        'Last.fm user not found.'
                    );

                    return;
                }


                const widgetURL =
                    buildWidgetURL(
                        username
                    );


                widgetURLInput.value =
                    widgetURL;

                preview.src =
                    widgetURL;

                output.style.display =
                    'block';


            } catch (error) {

                console.error(
                    'Generator error:',
                    error
                );


                alert(
                    'Unable to check Last.fm right now.'
                );


            } finally {

                generateButton.disabled =
                    false;

                generateButton.textContent =
                    'Generate Widget';
            }
        }


        function updatePreviewIfVisible() {

            if (
                output.style.display !==
                'block'
            ) {
                return;
            }


            const username =
                usernameInput.value.trim();


            if (!username) {
                return;
            }


            const widgetURL =
                buildWidgetURL(
                    username
                );


            widgetURLInput.value =
                widgetURL;

            preview.src =
                widgetURL;
        }


        backgroundColorInput.addEventListener(
            'input',
            function () {

                backgroundColorValue.textContent =
                    backgroundColorInput.value;

                updatePreviewIfVisible();
            }
        );


        accentColorInput.addEventListener(
            'input',
            function () {

                accentColorValue.textContent =
                    accentColorInput.value;

                updatePreviewIfVisible();
            }
        );


        opacityInput.addEventListener(
            'input',
            function () {

                opacityValue.textContent =
                    `${opacityInput.value}%`;

                updatePreviewIfVisible();
            }
        );


        showArtInput.addEventListener(
            'change',
            updatePreviewIfVisible
        );


        showStatusInput.addEventListener(
            'change',
            updatePreviewIfVisible
        );


        generateButton.addEventListener(
            'click',
            generateWidget
        );


        usernameInput.addEventListener(
            'keydown',
            function (event) {

                if (
                    event.key ===
                    'Enter'
                ) {

                    generateWidget();
                }
            }
        );


        copyButton.addEventListener(
            'click',
            async function () {

                const widgetURL =
                    widgetURLInput.value;


                if (!widgetURL) {
                    return;
                }


                try {

                    await navigator.clipboard
                        .writeText(
                            widgetURL
                        );


                    copyButton.textContent =
                        'Copied!';


                    setTimeout(
                        function () {

                            copyButton.textContent =
                                'Copy';

                        },
                        1500
                    );


                } catch (error) {

                    console.error(
                        'Clipboard copy failed:',
                        error
                    );


                    widgetURLInput.select();

                    document.execCommand(
                        'copy'
                    );
                }
            }
        );

    </script>

</body>

</html>
