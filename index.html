<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Last.fm Stream Widget</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 24px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #111118;
            color: white;

            font-family: Arial, Helvetica, sans-serif;
        }

        .setup {
            width: 100%;
            max-width: 720px;

            padding: 28px;

            background: #1c1c26;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 18px;
        }

        h1 {
            margin-top: 0;
            margin-bottom: 8px;
        }

        h2 {
            margin-top: 28px;
            margin-bottom: 16px;
            font-size: 16px;
        }

        p {
            color: rgba(255, 255, 255, 0.65);
            line-height: 1.5;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 12px 14px;

            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;

            background: #121219;
            color: white;

            font-size: 16px;
        }

        button {
            padding: 12px 16px;

            border: 0;
            border-radius: 10px;

            background: white;
            color: #111118;

            font-weight: 700;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .option-group {
            display: grid;
            gap: 18px;
        }

        .option-row {
            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 18px;
            padding: 14px;

            background: #15151d;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
        }

        .option-row > label {
            margin: 0;
        }

        .color-control {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        input[type="color"] {
            width: 46px;
            height: 40px;
            padding: 2px;

            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;

            background: #121219;
            cursor: pointer;
        }

        .hex-input {
            width: 120px !important;
        }

        .range-control {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        input[type="range"] {
            width: 190px;
        }

        .opacity-input {
            width: 76px !important;
            text-align: center;
        }

        .percent-symbol {
            color: rgba(255, 255, 255, 0.65);
        }

        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .actions {
            margin-top: 24px;
        }

        .output {
            display: none;
            margin-top: 28px;
        }

        .url-row {
            display: flex;
            gap: 10px;
        }

        .url-row input {
            flex: 1;
            min-width: 0;
        }

        .preview-wrapper {
            margin-top: 24px;
            padding: 18px;
            overflow: auto;

            background:
                linear-gradient(45deg, #222 25%, transparent 25%),
                linear-gradient(-45deg, #222 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #222 75%),
                linear-gradient(-45deg, transparent 75%, #222 75%);

            background-size: 20px 20px;

            background-position:
                0 0,
                0 10px,
                10px -10px,
                -10px 0px;

            border-radius: 14px;
        }

        iframe {
            width: 440px;
            max-width: 100%;
            height: 140px;

            border: 0;
            background: transparent;
        }

        @media (max-width: 600px) {

            .option-row {
                align-items: flex-start;
                flex-direction: column;
            }

            .color-control,
            .range-control {
                width: 100%;
            }

            .hex-input {
                flex: 1;
            }

            input[type="range"] {
                flex: 1;
            }

            .url-row {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <div class="setup">

        <h1>
            Last.fm Stream Widget
        </h1>

        <p>
            Enter the streamer's Last.fm username,
            customize the appearance, preview the widget,
            then copy the generated URL into Pogly
            as a browser/web source.
        </p>

        <label for="username">
            Last.fm Username
        </label>

        <input
            id="username"
            type="text"
            placeholder="ilyjonatan"
            autocomplete="off"
        >

        <h2>
            Appearance
        </h2>

        <div class="option-group">

            <div class="option-row">

                <label for="background-color">
                    Background Color
                </label>

                <div class="color-control">

                    <input
                        id="background-color"
                        type="color"
                        value="#14141c"
                    >

                    <input
                        id="background-color-text"
                        class="hex-input"
                        type="text"
                        value="#14141c"
                        maxlength="7"
                        spellcheck="false"
                    >

                </div>

            </div>

            <div class="option-row">

                <label for="accent-color">
                    Text / Accent Color
                </label>

                <div class="color-control">

                    <input
                        id="accent-color"
                        type="color"
                        value="#ffffff"
                    >

                    <input
                        id="accent-color-text"
                        class="hex-input"
                        type="text"
                        value="#ffffff"
                        maxlength="7"
                        spellcheck="false"
                    >

                </div>

            </div>

            <div class="option-row">

                <label for="opacity">
                    Background Opacity
                </label>

                <div class="range-control">

                    <input
                        id="opacity"
                        type="range"
                        min="0"
                        max="100"
                        value="92"
                    >

                    <input
                        id="opacity-text"
                        class="opacity-input"
                        type="number"
                        min="0"
                        max="100"
                        value="92"
                    >

                    <span class="percent-symbol">
                        %
                    </span>

                </div>

            </div>

            <div class="option-row">

                <label for="show-art">
                    Show Album Artwork
                </label>

                <input
                    id="show-art"
                    type="checkbox"
                    checked
                >

            </div>

            <div class="option-row">

                <label for="show-status">
                    Show "NOW PLAYING"
                </label>

                <input
                    id="show-status"
                    type="checkbox"
                    checked
                >

            </div>

        </div>

        <div class="actions">

            <button id="generate">
                Generate Widget
            </button>

        </div>

        <div
            class="output"
            id="output"
        >

            <label for="widget-url">
                Widget URL
            </label>

            <div class="url-row">

                <input
                    id="widget-url"
                    type="text"
                    readonly
                >

                <button id="copy">
                    Copy
                </button>

            </div>

            <div class="preview-wrapper">

                <iframe
                    id="preview"
                    title="Widget Preview"
                ></iframe>

            </div>

        </div>

    </div>

    <script>

        const usernameInput =
            document.getElementById('username');

        const generateButton =
            document.getElementById('generate');

        const output =
            document.getElementById('output');

        const widgetURLInput =
            document.getElementById('widget-url');

        const preview =
            document.getElementById('preview');

        const copyButton =
            document.getElementById('copy');


        const backgroundColorInput =
            document.getElementById(
                'background-color'
            );

        const backgroundColorText =
            document.getElementById(
                'background-color-text'
            );

        const accentColorInput =
            document.getElementById(
                'accent-color'
            );

        const accentColorText =
            document.getElementById(
                'accent-color-text'
            );

        const opacityInput =
            document.getElementById(
                'opacity'
            );

        const opacityText =
            document.getElementById(
                'opacity-text'
            );

        const showArtInput =
            document.getElementById(
                'show-art'
            );

        const showStatusInput =
            document.getElementById(
                'show-status'
            );


        let previewLoaded = false;


        function normalizeHex(value) {

            let hex =
                value
                    .trim()
                    .replace('#', '')
                    .toLowerCase();


            if (
                /^[0-9a-f]{6}$/.test(hex)
            ) {

                return `#${hex}`;
            }


            return null;
        }


        function cleanHexColor(value) {

            return value
                .replace('#', '')
                .toLowerCase();
        }


        function clampOpacity(value) {

            let number =
                Number(value);


            if (!Number.isFinite(number)) {
                number = 92;
            }


            return Math.min(
                100,
                Math.max(
                    0,
                    Math.round(number)
                )
            );
        }


        function getCurrentSettings() {

            return {

                art:
                    showArtInput.checked,

                status:
                    showStatusInput.checked,

                opacity:
                    Number(
                        opacityInput.value
                    ),

                bg:
                    cleanHexColor(
                        backgroundColorInput.value
                    ),

                accent:
                    cleanHexColor(
                        accentColorInput.value
                    )
            };
        }


        function buildWidgetURL(username) {

            const settings =
                getCurrentSettings();


            const params =
                new URLSearchParams();


            params.set(
                'user',
                username
            );

            params.set(
                'art',
                settings.art
                    ? '1'
                    : '0'
            );

            params.set(
                'status',
                settings.status
                    ? '1'
                    : '0'
            );

            params.set(
                'opacity',
                String(
                    settings.opacity
                )
            );

            params.set(
                'bg',
                settings.bg
            );

            params.set(
                'accent',
                settings.accent
            );


            return (
                `${window.location.origin}` +
                `/widget.html?${params.toString()}`
            );
        }


        function sendSettingsToPreview() {

            if (
                !previewLoaded ||
                !preview.contentWindow
            ) {
                return;
            }


            preview.contentWindow.postMessage(
                {
                    type:
                        'widget-settings',

                    settings:
                        getCurrentSettings()
                },
                window.location.origin
            );
        }


        function updateURLField() {

            const username =
                usernameInput.value.trim();


            if (!username) {
                return;
            }


            widgetURLInput.value =
                buildWidgetURL(
                    username
                );
        }


        function updateCustomization() {

            if (
                output.style.display ===
                'block'
            ) {

                updateURLField();
                sendSettingsToPreview();
            }
        }


        function syncBackgroundPickerToText() {

            backgroundColorText.value =
                backgroundColorInput.value;

            updateCustomization();
        }


        function syncBackgroundTextToPicker() {

            const normalized =
                normalizeHex(
                    backgroundColorText.value
                );


            if (!normalized) {
                return;
            }


            backgroundColorInput.value =
                normalized;

            backgroundColorText.value =
                normalized;

            updateCustomization();
        }


        function syncAccentPickerToText() {

            accentColorText.value =
                accentColorInput.value;

            updateCustomization();
        }


        function syncAccentTextToPicker() {

            const normalized =
                normalizeHex(
                    accentColorText.value
                );


            if (!normalized) {
                return;
            }


            accentColorInput.value =
                normalized;

            accentColorText.value =
                normalized;

            updateCustomization();
        }


        function syncOpacitySliderToText() {

            opacityText.value =
                opacityInput.value;

            updateCustomization();
        }


        function syncOpacityTextToSlider() {

            const value =
                clampOpacity(
                    opacityText.value
                );


            opacityText.value =
                value;

            opacityInput.value =
                value;

            updateCustomization();
        }


        async function generateWidget() {

            const username =
                usernameInput.value.trim();


            if (!username) {

                alert(
                    'Enter a Last.fm username.'
                );

                return;
            }


            generateButton.disabled =
                true;

            generateButton.textContent =
                'Checking...';


            try {

                const response =
                    await fetch(
                        `/api/lastfm?username=${encodeURIComponent(username)}`
                    );


                const data =
                    await response.json();


                if (
                    !response.ok ||
                    data.error
                ) {

                    alert(
                        data.message ||
                        'Last.fm user not found.'
                    );

                    return;
                }


                const widgetURL =
                    buildWidgetURL(
                        username
                    );


                widgetURLInput.value =
                    widgetURL;


                previewLoaded =
                    false;


                preview.src =
                    widgetURL;


                output.style.display =
                    'block';


            } catch (error) {

                console.error(
                    'Generator error:',
                    error
                );


                alert(
                    'Unable to check Last.fm right now.'
                );


            } finally {

                generateButton.disabled =
                    false;

                generateButton.textContent =
                    'Generate Widget';
            }
        }


        preview.addEventListener(
            'load',
            function () {

                previewLoaded =
                    true;

                sendSettingsToPreview();
            }
        );


        backgroundColorInput.addEventListener(
            'input',
            syncBackgroundPickerToText
        );


        backgroundColorText.addEventListener(
            'input',
            syncBackgroundTextToPicker
        );


        backgroundColorText.addEventListener(
            'blur',
            function () {

                const normalized =
                    normalizeHex(
                        backgroundColorText.value
                    );


                if (normalized) {

                    backgroundColorText.value =
                        normalized;

                } else {

                    backgroundColorText.value =
                        backgroundColorInput.value;
                }
            }
        );


        accentColorInput.addEventListener(
            'input',
            syncAccentPickerToText
        );


        accentColorText.addEventListener(
            'input',
            syncAccentTextToPicker
        );


        accentColorText.addEventListener(
            'blur',
            function () {

                const normalized =
                    normalizeHex(
                        accentColorText.value
                    );


                if (normalized) {

                    accentColorText.value =
                        normalized;

                } else {

                    accentColorText.value =
                        accentColorInput.value;
                }
            }
        );


        opacityInput.addEventListener(
            'input',
            syncOpacitySliderToText
        );


        opacityText.addEventListener(
            'input',
            syncOpacityTextToSlider
        );


        opacityText.addEventListener(
            'blur',
            syncOpacityTextToSlider
        );


        showArtInput.addEventListener(
            'change',
            updateCustomization
        );


        showStatusInput.addEventListener(
            'change',
            updateCustomization
        );


        generateButton.addEventListener(
            'click',
            generateWidget
        );


        usernameInput.addEventListener(
            'keydown',
            function (event) {

                if (
                    event.key ===
                    'Enter'
                ) {

                    generateWidget();
                }
            }
        );


        copyButton.addEventListener(
            'click',
            async function () {

                const widgetURL =
                    widgetURLInput.value;


                if (!widgetURL) {
                    return;
                }


                try {

                    await navigator.clipboard
                        .writeText(
                            widgetURL
                        );


                    copyButton.textContent =
                        'Copied!';


                    setTimeout(
                        function () {

                            copyButton.textContent =
                                'Copy';

                        },
                        1500
                    );


                } catch (error) {

                    console.error(
                        'Clipboard copy failed:',
                        error
                    );


                    widgetURLInput.select();

                    document.execCommand(
                        'copy'
                    );
                }
            }
        );

    </script>

</body>

</html>
