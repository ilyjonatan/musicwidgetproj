<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Last.fm Stream Widget</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 24px;

            background: #111118;
            color: white;

            font-family: Arial, Helvetica, sans-serif;
        }

        .setup {
            width: 100%;
            max-width: 600px;

            padding: 28px;

            background: #1c1c26;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 18px;
        }

        h1 {
            margin-top: 0;
        }

        p {
            color: rgba(255, 255, 255, 0.65);
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 12px 14px;

            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;

            background: #121219;
            color: white;

            font-size: 16px;
        }

        button {
            margin-top: 14px;
            padding: 12px 16px;

            border: 0;
            border-radius: 10px;

            background: white;
            color: #111118;

            font-weight: 700;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .output {
            margin-top: 24px;
            display: none;
        }

        .url-row {
            display: flex;
            gap: 10px;
        }

        .url-row input {
            flex: 1;
            min-width: 0;
        }

        .url-row button {
            margin-top: 0;
        }

        iframe {
            margin-top: 20px;

            width: 420px;
            max-width: 100%;
            height: 130px;

            border: 0;
            background: transparent;
        }
    </style>
</head>


<body>

    <div class="setup">

        <h1>
            Last.fm Stream Widget
        </h1>

        <p>
            Enter the streamer's Last.fm username,
            preview the widget, then copy the generated URL
            into Pogly as a browser/web source.
        </p>


        <label for="username">
            Last.fm Username
        </label>

        <input
            id="username"
            type="text"
            placeholder="ilyjonatan"
            autocomplete="off"
        >


        <button id="generate">
            Generate Widget
        </button>


        <div
            class="output"
            id="output"
        >

            <label for="widget-url">
                Widget URL
            </label>


            <div class="url-row">

                <input
                    id="widget-url"
                    type="text"
                    readonly
                >

                <button id="copy">
                    Copy
                </button>

            </div>


            <iframe
                id="preview"
                title="Widget Preview"
            ></iframe>

        </div>

    </div>


    <script>

        /* ================================
           ELEMENTS
        ================================ */

        const usernameInput =
            document.getElementById('username');

        const generateButton =
            document.getElementById('generate');

        const output =
            document.getElementById('output');

        const widgetURLInput =
            document.getElementById('widget-url');

        const preview =
            document.getElementById('preview');

        const copyButton =
            document.getElementById('copy');


        /* ================================
           GENERATE WIDGET
        ================================ */

        async function generateWidget() {

            const username =
                usernameInput.value.trim();


            if (!username) {

                alert(
                    'Enter a Last.fm username.'
                );

                return;
            }


            generateButton.disabled = true;

            generateButton.textContent =
                'Checking...';


            try {

                /*
                 * Check that Last.fm can find
                 * this username first.
                 */

                const response =
                    await fetch(
                        `/api/lastfm?username=${encodeURIComponent(username)}`
                    );


                const data =
                    await response.json();


                if (
                    !response.ok ||
                    data.error
                ) {

                    alert(
                        data.message ||
                        'Last.fm user not found.'
                    );

                    return;
                }


                /*
                 * Build the public widget URL.
                 */

                const widgetURL =
                    `${window.location.origin}/widget.html?user=${encodeURIComponent(username)}`;


                widgetURLInput.value =
                    widgetURL;


                /*
                 * Load the widget in the preview.
                 */

                preview.src =
                    widgetURL;


                /*
                 * Reveal the URL + preview.
                 */

                output.style.display =
                    'block';


            } catch (error) {

                console.error(
                    'Generator error:',
                    error
                );


                alert(
                    'Unable to check Last.fm right now.'
                );


            } finally {

                generateButton.disabled =
                    false;

                generateButton.textContent =
                    'Generate Widget';
            }
        }


        /* ================================
           GENERATE BUTTON
        ================================ */

        generateButton.addEventListener(
            'click',
            generateWidget
        );


        /*
         * Also allow Enter to generate.
         */

        usernameInput.addEventListener(
            'keydown',
            function (event) {

                if (event.key === 'Enter') {

                    generateWidget();
                }
            }
        );


        /* ================================
           COPY BUTTON
        ================================ */

        copyButton.addEventListener(
            'click',
            async function () {

                const widgetURL =
                    widgetURLInput.value;


                if (!widgetURL) {
                    return;
                }


                try {

                    await navigator.clipboard.writeText(
                        widgetURL
                    );


                    copyButton.textContent =
                        'Copied!';


                    setTimeout(
                        function () {

                            copyButton.textContent =
                                'Copy';

                        },
                        1500
                    );


                } catch (error) {

                    console.error(
                        'Clipboard copy failed:',
                        error
                    );


                    /*
                     * Fallback for browsers where
                     * Clipboard API isn't available.
                     */

                    widgetURLInput.select();

                    document.execCommand(
                        'copy'
                    );
                }
            }
        );

    </script>

</body>

</html>
