<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Last.fm Now Playing</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="widget" class="idle">

        <div id="album-container">

            <img
                id="album-art"
                src="https://picsum.photos/300"
                alt="Album Art"
            >

            <div id="music-indicator" class="idle">
                ♪
            </div>

        </div>

        <div id="track-info">

            <div id="status">
                <span id="status-dot"></span>
                <span id="status-text">NOT PLAYING</span>
            </div>

            <span id="song-title">
                Nothing Playing
            </span>

            <span id="artist-name">
                Start some music to sync
            </span>

        </div>

    </div>

    <script src="musicplayer.js"></script>

</body>

</html>
