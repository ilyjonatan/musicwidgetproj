```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Last.fm Now Playing</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* =========================
           MAIN WIDGET
        ========================= */

        #widget {
            width: 420px;
            min-height: 110px;

            display: flex;
            align-items: center;
            gap: 16px;

            padding: 12px;

            background: rgba(20, 20, 28, 0.92);
            border: 1px solid rgba(255, 255, 255, 0.10);
            border-radius: 18px;

            box-shadow:
                0 10px 35px rgba(0, 0, 0, 0.35),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);

            color: white;

            transition:
                opacity 0.4s ease,
                transform 0.4s ease;
        }

        #widget.hidden {
            opacity: 0;
            transform: translateY(8px);
        }

        /* =========================
           ALBUM ART
        ========================= */

        #album-container {
            position: relative;
            width: 86px;
            height: 86px;
            flex-shrink: 0;
        }

        #album-art {
            width: 86px;
            height: 86px;

            object-fit: cover;

            border-radius: 13px;

            background: #2a2a35;

            box-shadow:
                0 5px 18px rgba(0, 0, 0, 0.35);

            transition:
                opacity 0.35s ease,
                transform 0.35s ease;
        }

        #album-art.loading {
            opacity: 0.4;
        }

        /* Small music indicator */

        #music-indicator {
            position: absolute;

            bottom: -4px;
            right: -4px;

            width: 25px;
            height: 25px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: #ffffff;
            color: #181820;

            font-size: 12px;

            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.35);

            transition:
                opacity 0.3s ease,
                transform 0.3s ease;
        }

        #music-indicator.idle {
            opacity: 0;
            transform: scale(0.7);
        }

        /* =========================
           TEXT
        ========================= */

        #track-info {
            min-width: 0;
            flex: 1;

            display: flex;
            flex-direction: column;
            justify-content: center;

            gap: 5px;
        }

        #status {
            display: flex;
            align-items: center;
            gap: 6px;

            font-size: 11px;
            font-weight: 600;

            text-transform: uppercase;
            letter-spacing: 1.2px;

            color: rgba(255, 255, 255, 0.55);
        }

        #status-dot {
            width: 6px;
            height: 6px;

            border-radius: 50%;

            background: #8d8d99;

            transition: background 0.3s ease;
        }

        #status.playing #status-dot {
            background: #ffffff;

            box-shadow:
                0 0 8px rgba(255, 255, 255, 0.7);
        }

        #song-title {
            display: block;

            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;

            font-size: 18px;
            font-weight: 700;
            line-height: 1.2;

            color: #ffffff;
        }

        #artist-name {
            display: block;

            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;

            font-size: 14px;
            line-height: 1.2;

            color: rgba(255, 255, 255, 0.62);
        }

        /* =========================
           IDLE STATE
        ========================= */

        #widget.idle {
            background: rgba(20, 20, 28, 0.75);
        }

        #widget.idle #album-art {
            filter: grayscale(1);
            opacity: 0.45;
        }

        #widget.idle #song-title {
            color: rgba(255, 255, 255, 0.75);
        }

        /* =========================
           ANIMATION
        ========================= */

        @keyframes pulse {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.08);
            }

            100% {
                transform: scale(1);
            }
        }

        #music-indicator.playing {
            animation: pulse 1.5s ease-in-out infinite;
        }
    </style>
</head>

<body>

    <div id="widget" class="idle">

        <div id="album-container">

            <img
                id="album-art"
                src="https://picsum.photos/300"
                alt="Album Art"
            >

            <div id="music-indicator" class="idle">
                ♪
            </div>

        </div>

        <div id="track-info">

            <div id="status">
                <span id="status-dot"></span>
                <span id="status-text">NOT PLAYING</span>
            </div>

            <span id="song-title">
                Nothing Playing
            </span>

            <span id="artist-name">
                Start some music to sync
            </span>

        </div>

    </div>


    <script>

        /* ==================================================
           LAST.FM SETTINGS
        ================================================== */

        const LASTFM_USERNAME = 'ilyjonatan';

        const API_KEY = '3f17b007bcd1f7d3800430642f6a89ed';

        /*
         * How often OBS checks Last.fm.
         * 5000 = 5 seconds
         */
        const UPDATE_INTERVAL = 5000;


        /* ==================================================
           ELEMENTS
        ================================================== */

        const widget = document.getElementById('widget');
        const albumArt = document.getElementById('album-art');

        const songTitle = document.getElementById('song-title');
        const artistName = document.getElementById('artist-name');

        const status = document.getElementById('status');
        const statusText = document.getElementById('status-text');

        const musicIndicator =
            document.getElementById('music-indicator');


        /* ==================================================
           DEFAULT ALBUM ART
        ================================================== */

        const DEFAULT_ART =
            'https://picsum.photos/300';


        /* ==================================================
           SHOW PLAYING
        ================================================== */

        function showPlaying(track) {

            const title =
                track.name || 'Unknown Track';

            const artist =
                track.artist &&
                track.artist['#text']
                    ? track.artist['#text']
                    : 'Unknown Artist';


            songTitle.textContent = title;
            artistName.textContent = artist;


            /*
             * Last.fm returns several image sizes.
             * Prefer the largest available one.
             */

            let imageURL = DEFAULT_ART;

            if (
                track.image &&
                Array.isArray(track.image)
            ) {

                const imageSizes = [
                    'extralarge',
                    'large',
                    'medium',
                    'small'
                ];

                for (const size of imageSizes) {

                    const image =
                        track.image.find(
                            img => img.size === size
                        );

                    if (
                        image &&
                        image['#text']
                    ) {

                        imageURL = image['#text'];
                        break;

                    }

                }

            }


            /*
             * Fade album art while changing it.
             */

            albumArt.classList.add('loading');

            const newImage = new Image();

            newImage.onload = function () {

                albumArt.src = imageURL;

                setTimeout(() => {
                    albumArt.classList.remove('loading');
                }, 50);

            };

            newImage.onerror = function () {

                albumArt.src = DEFAULT_ART;
                albumArt.classList.remove('loading');

            };

            newImage.src = imageURL;


            /*
             * Update widget state.
             */

            widget.classList.remove('idle');

            status.classList.add('playing');

            statusText.textContent = 'NOW PLAYING';

            musicIndicator.classList.remove('idle');
            musicIndicator.classList.add('playing');
        }


        /* ==================================================
           SHOW NOTHING PLAYING
        ================================================== */

        function showNothingPlaying() {

            songTitle.textContent =
                'Nothing Playing';

            artistName.textContent =
                'Start some music to sync';


            albumArt.src = DEFAULT_ART;


            widget.classList.add('idle');

            status.classList.remove('playing');

            statusText.textContent =
                'NOT PLAYING';

            musicIndicator.classList.remove('playing');
            musicIndicator.classList.add('idle');
        }


        /* ==================================================
           SHOW ERROR
        ================================================== */

        function showError() {

            songTitle.textContent =
                'Last.fm Error';

            artistName.textContent =
                'Check your username or API key';


            widget.classList.add('idle');

            status.classList.remove('playing');

            statusText.textContent =
                'ERROR';

            musicIndicator.classList.remove('playing');
            musicIndicator.classList.add('idle');

        }


        /* ==================================================
           LAST.FM CALLBACK
        ================================================== */

        window.handleLastFMResponse =
            function(data) {

                try {

                    /*
                     * Last.fm API error
                     */

                    if (
                        !data ||
                        data.error
                    ) {

                        console.error(
                            'Last.fm error:',
                            data
                        );

                        showError();
                        return;

                    }


                    /*
                     * Make sure tracks exist.
                     */

                    if (
                        !data.recenttracks ||
                        !data.recenttracks.track
                    ) {

                        showNothingPlaying();
                        return;

                    }


                    /*
                     * Last.fm normally returns an array.
                     */

                    const tracks =
                        data.recenttracks.track;

                    const track =
                        Array.isArray(tracks)
                            ? tracks[0]
                            : tracks;


                    if (!track) {

                        showNothingPlaying();
                        return;

                    }


                    /*
                     * Check Last.fm's nowplaying flag.
                     */

                    const isPlaying =
                        track['@attr'] &&
                        track['@attr'].nowplaying === 'true';


                    if (isPlaying) {

                        showPlaying(track);

                    } else {

                        showNothingPlaying();

                    }

                }

                catch (error) {

                    console.error(
                        'Last.fm data error:',
                        error
                    );

                    showError();

                }

            };


        /* ==================================================
           QUERY LAST.FM
        ================================================== */

        function queryLastFM() {

            /*
             * Remove previous JSONP request.
             */

            const oldScript =
                document.getElementById(
                    'lastfm-jsonp'
                );

            if (oldScript) {
                oldScript.remove();
            }


            /*
             * Create a fresh request.
             */

            const script =
                document.createElement('script');


            script.id =
                'lastfm-jsonp';


            script.src =
                `https://ws.audioscrobbler.com/2.0/?` +
                `method=user.getrecenttracks` +
                `&user=${encodeURIComponent(LASTFM_USERNAME)}` +
                `&api_key=${encodeURIComponent(API_KEY)}` +
                `&format=json` +
                `&limit=1` +
                `&callback=handleLastFMResponse` +
                `&_ts=${Date.now()}`;


            script.onerror =
                function() {

                    console.error(
                        'Could not connect to Last.fm.'
                    );

                    showError();

                };


            document.body.appendChild(script);

        }


        /* ==================================================
           START
        ================================================== */

        queryLastFM();

        setInterval(
            queryLastFM,
            UPDATE_INTERVAL
        );

    </script>

</body>
</html>
